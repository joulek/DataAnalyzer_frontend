server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Toutes les routes React renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les fichiers compilés (ils ont un hash dans le nom)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}