name: Build et publication - frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=http://127.0.0.1:8000
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dataanalyzer-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dataanalyzer-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max